name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    # Linux: ao contrario dos outros repos do portfolio, os testes deste nao
    # dependem de pywin32/wmi. Os testes que precisam de DPAPI usam skip
    # condicional, entao a suuite roda em qualquer SO.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: o scanner de segredos precisa ver todas as revisoes,
          # nao apenas o HEAD - o GitHub publica as revisoes.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Syntax check
        run: python -m compileall -q .

      - name: Tests
        run: pytest

      - name: Secret scan (gitleaks, todo o historico)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tar.gz
          tar xzf gl.tar.gz
          ./gitleaks detect --no-banner --redact --log-opts="--all --pretty=oneline --abbrev-commit"
